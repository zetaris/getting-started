name: Publish onboarding guide

on:
  push:
    branches: [codex/hackathon-user-journey]
    paths:
      - 'START-HERE.md'
      - 'docs/**'
      - 'open_data/**'
      - 'scripts/HOWTO.md'
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts --prefix website
      - run: npm run build --prefix website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              })
              core.setOutput('enabled', 'true')
            } catch (error) {
              if (error.status === 404) {
                core.info(`GitHub Pages is not enabled for ${context.repo.owner}/${context.repo.repo}; skipping deployment.`)
                core.setOutput('enabled', 'false')
                return
              }

              throw error
            }
      - name: Deploy to GitHub Pages
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report skipped deployment
        if: steps.pages_check.outputs.enabled == 'false'
        run: echo "Deploy step skipped because GitHub Pages is not enabled."
