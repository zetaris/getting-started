# Postgres, Milvus, and the help app. Zetaris and Ollama stay separate installs.
# From examples/help-app:
#   docker compose --env-file ../../.env.local -f compose/docker-compose.yml up -d
# This starts containers. It does not register datasources or ingest.
# Do not run `down -v`: the Postgres volume is the catalog already on this machine.
#
# Set MILVUS_IMAGE_TAG in .env.local to a Milvus release you have tested. None is
# recorded here, so `up` refuses to start until it is set.
# .env.local keeps ZETARIS_REST_URL on 127.0.0.1 so host ingest can reach the
# API. The help service below overrides that to host.docker.internal, because
# localhost inside the container is the container.
name: help-app
services:
  postgres:
    image: postgres:${HELP_PG_IMAGE_TAG:-16}
    container_name: help-app-postgres-postgres-1
    environment:
      POSTGRES_DB: ${HELP_PG_DB:-help}
      POSTGRES_USER: ${HELP_PG_USER:-help}
      POSTGRES_PASSWORD: ${HELP_PG_PASSWORD:?set HELP_PG_PASSWORD in .env.local}
    volumes:
      - help-pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${HELP_PG_USER:-help} -d ${HELP_PG_DB:-help}",
      ]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:${MILVUS_IMAGE_TAG:?set MILVUS_IMAGE_TAG to a Milvus release you have tested}
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    # Shifted from Milvus's defaults (19530, 9091) so this does not collide with
    # another Milvus. Host ingest uses 127.0.0.1:19531. Zetaris, outside this
    # compose, uses MILVUS_URI=http://host.docker.internal:19531.
    ports:
      - "127.0.0.1:19531:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    security_opt:
      - seccomp:unconfined

  help:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /repo/examples/help-app
    volumes:
      - ../../..:/repo:ro
    env_file:
      - ../../../.env.local
    environment:
      # Listen on every interface inside the container. The publish below stays
      # on 127.0.0.1. HELP_PORT is fixed so it matches that publish.
      HELP_HOST: 0.0.0.0
      HELP_PORT: "8000"
      # Host scripts use 127.0.0.1:8888 from .env.local. Inside this container
      # that address is the container, and Zetaris is published on the host.
      ZETARIS_REST_URL: http://host.docker.internal:8888/api/v1.0
      # The app's own collection checks. Host scripts keep 127.0.0.1:19531.
      MILVUS_HOST_URI: http://milvus:19530
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  help-pg-data:
    name: help-app-postgres_help-pg-data
  milvus-data:
